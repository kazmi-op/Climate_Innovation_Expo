<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Portal | Climate Innovation & Sustainability Expo</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    
    <style>
        :root {
            --forest: #1e3a2f;
            --emerald: #2e7d5e;
            --earth: #8b6b4d;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
            font-family: 'Manrope', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        /* --- Outer Glass Container --- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
        }

        /* --- Responsive Header --- */
        .header-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 12px;
        }
        .header-logo { 
            height: 60px; 
            width: auto; 
            flex-shrink: 0;
        }
        .header-title {
            flex: 1;
            text-align: center;
            font-size: clamp(0.75rem, 3vw, 1.25rem);
            font-weight: 700;
            color: var(--forest);
            margin: 0;
            line-height: 1.2;
        }

        /* --- Form Layout --- */
        .form-wrapper {
            max-width: 448px;
            margin: 0 auto;
            width: 100%;
        }
        .intro { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
            text-align: center; 
            margin-bottom: 24px; 
        }
        .intro h2 { 
            font-size: clamp(1.25rem, 4vw, 1.625rem); 
            font-weight: 800; 
            letter-spacing: -.65px; 
            color: #064b2d; 
            margin: 0; 
        }
        .intro p { 
            font-size: clamp(0.8rem, 3vw, 0.85rem); 
            color: #4b5563; 
            margin: 0; 
        }

        #cert-form { display: flex; flex-direction: column; gap: 16px; margin: 0; }
        
        .field { display: flex; flex-direction: column; gap: 6px; }
        .label { font-size: 10px; line-height: 14px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #064b2d; }
        
        .control { position: relative; width: 100%; }
        .control .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; pointer-events: none; }
        .control input, .control select { 
            width: 100%; 
            height: 46px; 
            padding: 0 16px 0 43px; 
            font-size: 14px; 
            background: #fff; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            outline: none; 
            transition: border-color .15s, box-shadow .15s;
            color: #1f2937;
        }
        .control select { appearance: none; -webkit-appearance: none; padding-right: 40px; cursor: pointer; }
        .control input:focus, .control select:focus { border-color: #0c6b35; box-shadow: 0 0 0 3px rgba(12,107,53,.1); }
        .control input.invalid, .control select.invalid { border-color: #b91c1c; }
        
        .chevron { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); width: 10px; height: 6px; pointer-events: none; }
        .divider { height: 1px; background: #e2e8f0; margin: 2px 0; }

        /* --- Submit Button --- */
        .submit { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            width: 100%; 
            margin-top: 6px; 
            padding: 14px 16px; 
            font-size: 14px; 
            font-weight: 700; 
            color: #fff; 
            background: #064b2d; 
            border: 0; 
            border-radius: 8px;
            box-shadow: 0 2px 2px rgba(6,75,45,.1), 0 4px 6px rgba(6,75,45,.2); 
            cursor: pointer; 
            transition: background .15s, transform .05s; 
        }
        .submit:hover { background: #0c6b35; }
        .submit:active { transform: translateY(1px); }
        .submit img { width: 14px; height: 14px; }
        .submit:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .status { margin-top: -8px; text-align: center; font-size: 11px; font-weight: 600; color: #0c6b35; }

        /* --- Responsive Breakpoints --- */
        @media (max-width: 400px) {
            .header-logo { height: 45px; }
            .header-title { font-size: 0.7rem; }
            .glass-card { border-radius: 16px; }
            .form-wrapper { padding: 0 8px; }
            .control input, .control select { height: 42px; font-size: 13px; }
            .submit { padding: 12px; font-size: 13px; }
        }

        @media (min-width: 768px) {
            .header-logo { height: 70px; }
            .header-card { padding: 16px 24px; }
            .container { max-width: 900px; }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('cert-form').addEventListener('submit', async (e) => {
            e.preventDefault();
                
            const form = e.target;
            const btn = document.getElementById('submit-btn');
            const label = document.getElementById('submit-label');
            const errDiv = document.getElementById('errorMsg');
                
            btn.disabled = true;
            label.textContent = 'Verifying...';
            errDiv.textContent = '';
                
            const formData = new FormData(form);
                
            try {
                const res = await fetch('/certificate', { 
                    method: 'POST', 
                    body: formData 
                });
                
                const data = await res.json();
            
                if (!res.ok) {
                    throw new Error(data.error || 'Verification failed.');
                }
            
                // If successful, replace the entire body with the certificate HTML
                if (data.success && data.html) {
                    document.body.innerHTML = data.html;
                    // Optional: Scroll to top
                    window.scrollTo(0, 0); 
                } else {
                    throw new Error("Invalid response from server.");
                }
            
            } catch (err) {
                errDiv.textContent = err.message;
                btn.disabled = false;
                label.textContent = 'Verify & Generate Certificate';
            }
        });
    </script>
