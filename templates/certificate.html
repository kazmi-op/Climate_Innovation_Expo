<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate | Climate Innovation & Sustainability Expo 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Load html2canvas and jsPDF separately for perfect control -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --forest: #1e3a2f;
            --emerald: #2e7d5e;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
            font-family: 'Manrope', sans-serif;
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
        }
        .header-logo { height: 70px; width: auto; }

        /* --- Certificate Design (A4 Landscape Ratio: 1.414) --- */
        .cert-wrapper {
            display: flex;
            justify-content: center;
            padding: 20px;
            overflow-x: auto;
        }
        
        .certificate-container {
            /* A4 Landscape Proportions */
            width: 1122px; 
            height: 793px; 
            background: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            position: relative;
            flex-shrink: 0;
            padding: 20px;
        }
        
        .certificate-border {
            width: 100%;
            height: 100%;
            border: 12px solid var(--forest);
            padding: 20px;
            position: relative;
            background: #fdfdfd;
            display: flex;
            flex-direction: column;
        }
        
        .certificate-inner-border {
            width: 100%;
            height: 100%;
            border: 2px solid #d4af37; /* Gold */
            padding: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        
        /* Decorative Corner Accents */
        .corner {
            position: absolute; width: 50px; height: 50px; border-color: var(--forest); border-style: solid;
        }
        .top-left { top: 0; left: 0; border-width: 6px 0 0 6px; }
        .top-right { top: 0; right: 0; border-width: 6px 6px 0 0; }
        .bottom-left { bottom: 0; left: 0; border-width: 0 0 6px 6px; }
        .bottom-right { bottom: 0; right: 0; border-width: 0 6px 6px 0; }

        /* Header */
        .cert-header { display: flex; align-items: center; justify-content: center; gap: 30px; width: 100%; margin-top: 20px;}
        .cert-logo { height: 90px; width: auto; }
        .cert-title { font-family: 'Playfair Display', serif; font-size: 52px; font-weight: 700; color: var(--forest); text-transform: uppercase; letter-spacing: 3px; margin: 0; line-height: 1; }
        .cert-subtitle { font-size: 16px; font-weight: 700; letter-spacing: 6px; color: #d4af37; text-transform: uppercase; margin-top: 10px; }
        
        /* Body */
        .cert-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; text-align: center; }
        .cert-text { font-size: 20px; color: #555; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .cert-name { font-family: 'Playfair Display', serif; font-size: 64px; font-weight: 700; color: var(--forest); border-bottom: 3px solid #d4af37; padding-bottom: 10px; margin-bottom: 25px; min-width: 500px; line-height: 1.2; }
        .cert-details { font-size: 18px; color: #333; max-width: 800px; line-height: 1.8; }
        .cert-roll { font-weight: 800; color: var(--forest); font-size: 22px; }
        
        /* Footer */
        .cert-footer { display: flex; justify-content: space-between; width: 100%; padding: 0 60px; margin-bottom: 20px; }
        .signature { display: flex; flex-direction: column; align-items: center; border-top: 2px solid #333; width: 250px; padding-top: 10px; }
        .signature .title { font-size: 14px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 1px; }

        /* Button */
        .btn-emerald {
            background: linear-gradient(135deg, var(--emerald), var(--forest));
            color: white; border: none; border-radius: 12px; padding: 14px 32px;
            font-weight: 600; transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(30, 58, 47, 0.2);
        }
        .btn-emerald:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30, 58, 47, 0.3); color: white; }
        
        /* Scale down on smaller screens for viewing only */
        @media (max-width: 1200px) {
            .cert-wrapper { justify-content: flex-start; }
            .certificate-container { transform: scale(0.7); transform-origin: top left; margin-bottom: -250px; }
        }
        @media (max-width: 800px) {
            .certificate-container { transform: scale(0.4); margin-bottom: -480px; }
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <!-- Header -->
        <div class="glass-card p-3 mb-4 d-flex justify-content-between align-items-center">
            <img src="{{ url_for('static', filename='uni_logo.png') }}" alt="University" class="header-logo">
            <h4 class="text-center mb-0 fw-bold d-none d-md-block" style="color: var(--forest);">Certificate of Participation</h4>
            <img src="{{ url_for('static', filename='event_logo.png') }}" alt="CCESC" class="header-logo">
        </div>

        <!-- Certificate Display -->
        <div class="glass-card p-4 text-center">
            <div class="cert-wrapper">
                <!-- The Certificate Element to be Captured -->
                <div class="certificate-container" id="certificate-node">
                    <div class="certificate-border">
                        <div class="certificate-inner-border">
                            <!-- Corner Accents -->
                            <div class="corner top-left"></div>
                            <div class="corner top-right"></div>
                            <div class="corner bottom-left"></div>
                            <div class="corner bottom-right"></div>

                            <!-- Certificate Header -->
                            <div class="cert-header">
                                <img src="{{ url_for('static', filename='uni_logo.png') }}" alt="Logo" class="cert-logo" crossorigin="anonymous">
                                <div>
                                    <h1 class="cert-title">Certificate</h1>
                                    <p class="cert-subtitle">of Participation</p>
                                </div>
                                <img src="{{ url_for('static', filename='event_logo.png') }}" alt="Logo" class="cert-logo" crossorigin="anonymous">
                            </div>

                            <!-- Certificate Body -->
                            <div class="cert-body">
                                <p class="cert-text">This is to certify that</p>
                                <h2 class="cert-name">{{ name }}</h2>
                                <p class="cert-details">
                                    Roll Number: <span class="cert-roll">{{ roll_no }}</span><br>
                                    from <strong>{{ institute_name }}</strong>
                                </p>
                                <p class="cert-details" style="margin-top: 20px;">
                                    has successfully participated in the <br>
                                    <strong>Climate Innovation & Sustainability Expo 2026</strong>
                                </p>
                            </div>

                            <!-- Certificate Footer -->
                            <div class="cert-footer">
                                <div class="signature">
                                    <span class="title">Event Coordinator</span>
                                </div>
                                <div class="signature">
                                    <span class="title">Vice Chancellor</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-4 d-flex justify-content-center">
                <button type="button" class="btn btn-emerald" id="downloadPdf">Download PDF</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('downloadPdf').addEventListener('click', function() {
            const element = document.getElementById('certificate-node');
            const btn = this;
            const originalText = btn.textContent;
            
            btn.textContent = 'Generating PDF...';
            btn.disabled = true;

            // 1. Take a high-resolution screenshot of the certificate
            html2canvas(element, {
                scale: 3, // High resolution
                useCORS: true, // Allow loading external images (logos)
                backgroundColor: '#ffffff'
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                
                // 2. Initialize jsPDF for A4 Landscape
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'landscape',
                    unit: 'mm',
                    format: 'a4'
                });

                // 3. Calculate exact dimensions to fit A4 perfectly
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();

                // Add image to fill the entire A4 page
                pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);

                // 4. Save the PDF
                pdf.save(`Certificate-{{ name | replace(" ", "-") }}.pdf`);

                // Reset button
                btn.textContent = originalText;
                btn.disabled = false;

            }).catch(err => {
                console.error("PDF Error:", err);
                alert("Failed to generate PDF. Please try again.");
                btn.textContent = originalText;
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
