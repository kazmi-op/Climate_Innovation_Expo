<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Verification Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background: #f8f7f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .scanner-container { max-width: 500px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid #064b2d; }
        .result-box { margin-top: 20px; padding: 20px; border-radius: 12px; display: none; }
        .result-success { background: #d1fae5; border: 1px solid #10b981; color: #064e3b; }
        .result-error { background: #fee2e2; border: 1px solid #ef4444; color: #7f1d1d; }
    </style>
</head>
<body>

<div class="container">
    <div class="scanner-container">
        <h3 class="mb-4" style="color: #064b2d; font-weight: 800;">Participant Verification</h3>
        <p class="text-muted small">Point the camera at the QR code on the ID card.</p>
        
        <!-- Camera Feed -->
        <div id="reader"></div>
        
        <!-- Result Area -->
        <div id="result" class="result-box">
            <h5 id="result-title" class="fw-bold"></h5>
            <p id="result-message" class="mb-2"></p>
            <div id="result-data" style="font-size: 14px;"></div>
        </div>
        
        <button class="btn btn-outline-secondary mt-3 w-100" onclick="resetScanner()">Scan Another</button>
    </div>
</div>

<script>
    let html5QrcodeScanner;
    let isScanning = false;

    function onScanSuccess(decodedText, decodedResult) {
        // Stop scanning immediately to prevent multiple API hits
        if (isScanning) {
            html5QrcodeScanner.clear();
            isScanning = false;
        }

        // The decodedText is the URL generated in the backend (e.g., https://yourdomain.com/api/verify?token=xyz)
        // We extract the token from the URL
        let token = '';
        try {
            const url = new URL(decodedText);
            token = url.searchParams.get('token');
        } catch (e) {
            // If it's just the raw token (not a URL)
            token = decodedText; 
        }

        if (!token) {
            showResult(false, "Invalid QR Code format.");
            return;
        }

        // Send token to backend for verification
        fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showResult(true, data.message, data.data);
            } else {
                showResult(false, data.message);
            }
        })
        .catch(err => {
            console.error(err);
            showResult(false, "Network error. Please try again.");
        });
    }

    function showResult(isSuccess, message, data = null) {
        const resultBox = document.getElementById('result');
        const title = document.getElementById('result-title');
        const msg = document.getElementById('result-message');
        const dataDiv = document.getElementById('result-data');

        resultBox.style.display = 'block';
        resultBox.className = 'result-box ' + (isSuccess ? 'result-success' : 'result-error');
        
        title.textContent = isSuccess ? "✅ Verified" : "❌ Verification Failed";
        msg.textContent = message;
        
        if (data) {
            dataDiv.innerHTML = `
                <strong>Name:</strong> ${data.name}<br>
                <strong>Roll No:</strong> ${data.roll_no}<br>
                <strong>Institute:</strong> ${data.institute}
            `;
        } else {
            dataDiv.innerHTML = '';
        }
    }

    function resetScanner() {
        document.getElementById('result').style.display = 'none';
        startScanner();
    }

    function startScanner() {
        if (!html5QrcodeScanner) {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: 250 }
            );
        }
        html5QrcodeScanner.render(onScanSuccess);
        isScanning = true;
    }

    // Start on page load
    startScanner();
</script>

</body>
</html>
