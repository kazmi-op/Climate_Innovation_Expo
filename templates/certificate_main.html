<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Certificate Generation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
            font-family: 'Manrope', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .btn-emerald {
            background: linear-gradient(135deg, #2e7d5e, #1e3a2f);
            color: white; border: none; border-radius: 12px; padding: 15px 32px;
            font-weight: 700; font-size: 16px; transition: all 0.3s; width: 100%;
            box-shadow: 0 4px 12px rgba(30, 58, 47, 0.2);
        }
        .btn-emerald:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30, 58, 47, 0.3); color: white; }
    </style>
</head>
<!-- Inside certificate_main.html -->
<body>
    <div class="glass-card position-relative">
        <!-- Logout Button -->
        <a href="/logout" class="btn btn-outline-danger position-absolute top-0 end-0 m-3">Logout</a>

        <h2 class="mb-3 fw-bold" style="color: #064b2d;">Admin Certificate Portal</h2>
        <p class="text-muted mb-4">Click the button below to generate and download the PDF certificates for all active participants in a single ZIP file.</p>
        
        <a href="/certificate/download-all" class="btn btn-emerald" onclick="this.innerHTML='Generating ZIP... (Please wait)'; this.classList.add('disabled');">
            Download All Certificates (ZIP)
        </a>
        
        <p class="mt-3 text-muted" style="font-size: 12px;">This may take a few seconds depending on the number of participants.</p>
    </div>
</body>
</html>
